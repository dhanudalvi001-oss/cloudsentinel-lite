AWSTemplateFormatVersion: '2010-09-09'
Description: CloudSentinel-Lite - detect and auto-fix risky AWS settings

Parameters:
  AlertEmail:
    Type: String
  DryRun:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  ScopePrefix:
    Type: String
    Default: cs-demo-

Resources:
  TrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cloudsentinel-trail-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: 7

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/cloudsentinel-trail
          - Sid: Write
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/cloudsentinel-trail

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: cloudsentinel-trail
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: true
      EventSelectors:
        - ReadWriteType: WriteOnly
          IncludeManagementEvents: true

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: finding_id
          AttributeType: S
      KeySchema:
        - AttributeName: finding_id
          KeyType: HASH

  FindingsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  FindingsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FindingsDLQ.Arn
        maxReceiveCount: 3

  DetectorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: detector-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetBucketPublicAccessBlock
                Resource: !Sub arn:aws:s3:::${ScopePrefix}*
              - Effect: Allow
                Action: ec2:DescribeSecurityGroups
                Resource: '*'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FindingsQueue.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt FindingsTable.Arn

  RemediatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: remediator-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutBucketPublicAccessBlock
                Resource: !Sub arn:aws:s3:::${ScopePrefix}*
              - Effect: Allow
                Action: ec2:DescribeSecurityGroups
                Resource: '*'
              - Effect: Allow
                Action: ec2:RevokeSecurityGroupIngress
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt FindingsQueue.Arn
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt FindingsTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  DetectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudsentinel-detector
      Runtime: python3.12
      Handler: app.lambda_handler
      Timeout: 30
      Role: !GetAtt DetectorRole.Arn
      Code: lambdas/detector/
      Environment:
        Variables:
          SCOPE_PREFIX: !Ref ScopePrefix
          QUEUE_URL: !Ref FindingsQueue
          TABLE_NAME: !Ref FindingsTable

  RemediatorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudsentinel-remediator
      Runtime: python3.12
      Handler: app.lambda_handler
      Timeout: 30
      Role: !GetAtt RemediatorRole.Arn
      Code: lambdas/remediator/
      Environment:
        Variables:
          DRY_RUN: !Ref DryRun
          SCOPE_PREFIX: !Ref ScopePrefix
          TOPIC_ARN: !Ref AlertTopic
          TABLE_NAME: !Ref FindingsTable

  RemediatorQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt FindingsQueue.Arn
      FunctionName: !Ref RemediatorFunction
      BatchSize: 1

  S3RiskRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Risky S3 public access changes
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - s3.amazonaws.com
          eventName:
            - PutBucketAcl
            - PutBucketPolicy
            - DeleteBucketPublicAccessBlock
            - PutBucketPublicAccessBlock
      Targets:
        - Arn: !GetAtt DetectorFunction.Arn
          Id: detector

  SgRiskRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Security group ingress changes
      State: ENABLED
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - ec2.amazonaws.com
          eventName:
            - AuthorizeSecurityGroupIngress
      Targets:
        - Arn: !GetAtt DetectorFunction.Arn
          Id: detector

  AllowS3Rule:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DetectorFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt S3RiskRule.Arn

  AllowSgRule:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DetectorFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SgRiskRule.Arn

  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A finding could not be fixed after 3 tries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FindingsDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  TableName:
    Value: !Ref FindingsTable
  QueueUrl:
    Value: !Ref FindingsQueue
  DlqUrl:
    Value: !Ref FindingsDLQ
